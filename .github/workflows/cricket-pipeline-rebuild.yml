name: Cricket pipeline rebuild

on:
  push:
    branches:
      - claude/cricket-pipeline-audit-y01rn5
    paths-ignore:
      - 'outputs/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cricket-pipeline-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: claude/cricket-pipeline-audit-y01rn5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run complete rebuild
        run: |
          set -o pipefail
          python -u run_all.py 2>&1 | tee pipeline.log

      - name: Run acceptance tests
        run: |
          python -m pytest -q tests

      - name: Upload rebuild outputs and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cricket-pipeline-rebuild-${{ github.run_number }}
          path: |
            pipeline.log
            outputs/
            docs/
            data/interim/
            data/processed/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit regenerated reports and outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ docs/FINDINGS.md docs/V2_FINDINGS.md docs/V3_FINDINGS.md
          if git diff --cached --quiet; then
            echo "Generated reports and outputs are already current."
          else
            git commit -m "Refresh cricket pipeline outputs"
            git push origin HEAD:claude/cricket-pipeline-audit-y01rn5
          fi
